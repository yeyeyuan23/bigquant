name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - name: E9 sealed experiment checks
        run: |
          python -m pytest -q -o addopts="" experiments/finals_pre/tcn_architecture_o2c/test_protocol.py
          python experiments/finals_pre/tcn_architecture_o2c/analysis/verify_results.py
      - run: coverage run -m pytest -q
      - run: coverage combine
      - run: coverage report --include="src/*" --fail-under=75

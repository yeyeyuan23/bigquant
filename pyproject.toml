[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bigalpha-2026-factors"
version = "0.1.0"
description = "BigAlpha 2026 factor selection and evaluation toolkit"
requires-python = ">=3.11"
dependencies = [
  "lightgbm>=4.3,<5",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow==25.0.0",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.15,<8",
  "pytest==9.1.1",
  "ruff==0.16.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
parallel = true
concurrency = ["multiprocessing"]
source = ["src/bigalpha2026", "scripts"]

[tool.coverage.report]
show_missing = true
skip_covered = true

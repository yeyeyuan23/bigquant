[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bigalpha-2026-factors"
version = "0.1.0"
description = "BigAlpha 2026 factor selection and evaluation toolkit"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.4,<2",
  "lightgbm>=4.3,<5",
  "nbformat>=5.10,<6",
  "numpy>=1.24",
  "pandas>=2.0",
  "polars>=1.30,<2",
  "pyarrow==25.0.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
]

[project.optional-dependencies]
neural = [
  "torch==2.6.0",
]
dev = [
  "coverage[toml]>=7.15,<8",
  "pytest==9.1.1",
  "ruff==0.16.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# Experimental source is assembled from standalone candidate modules, so
# repeated helper imports/definitions are intentional until it is promoted.
"submissions/lgbm_t_top50_candidate.py" = ["F811", "I001"]
"submissions/lgbm_t_top50_candidate.ipynb" = ["F811", "I001"]
# Self-contained submission artifacts intentionally embed several standalone
# candidate modules in one file/cell. Their duplicate imports and helper names
# are isolated inside the runtime installer and are therefore expected.
"submissions/*_candidate.py" = ["F811", "I001"]
"submissions/*_candidate.ipynb" = ["F811", "I001"]
"remote_submission_notebooks/*_candidate.py" = ["F811", "I001"]
"remote_submission_notebooks/*_candidate.ipynb" = ["F811", "I001"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
parallel = true
concurrency = ["multiprocessing"]
source = ["src/bigalpha2026", "scripts"]

[tool.coverage.report]
show_missing = true
skip_covered = true
